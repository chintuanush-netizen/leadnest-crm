<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the saved Day/Night choice before the page paints (no flash).
      try {
        var t = localStorage.getItem("leadnest-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        var d = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", d ? "#18181b" : "#ffffff");
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Leadnest CRM</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
